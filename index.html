<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤형 스마트 뉴스 리더 - 스크랩 & 키워드 맞춤 추천</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 헤더 영역 -->
  <header class="header">
    <div class="header-container">
      <div class="logo-area">
        <span class="logo-badge">LIVE NEWS FEED</span>
        <h1 class="logo-title">Personalized News Reader</h1>
        <p class="logo-subtitle">관심 키워드 맞춤 추천 • 실시간 검색 • 기사 스크랩</p>
      </div>

      <!-- 상단 액션 바: 검색창 & 스크랩 보기 토글 -->
      <div class="header-actions">
        <!-- 검색창 -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="기사 제목 또는 내용 검색..." aria-label="기사 검색">
          <button type="button" id="btnSearchClear" class="search-clear-btn" aria-label="검색어 지우기" style="display:none;">✕</button>
        </div>

        <!-- 탭 전환 버튼 (전체 피드 vs 스크랩 보관함) -->
        <div class="view-tabs">
          <button type="button" class="tab-btn active" id="tabFeed" data-tab="feed">
            <span>실시간 피드</span>
          </button>
          <button type="button" class="tab-btn" id="tabBookmarks" data-tab="bookmarks">
            <span class="tab-bookmark-icon">★</span>
            <span>스크랩 보관함</span>
            <span class="bookmark-badge" id="bookmarkBadge">0</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤 바: 주제 선택 + 관심 키워드 등록기 -->
    <div class="header-subbar">
      <!-- 주제 다중 선택 -->
      <section class="control-panel" aria-label="뉴스 주제 선택">
        <div class="category-selection-wrapper">
          <span class="category-label">주제 :</span>
          <div class="category-chips" id="categoryChips">
            <label class="chip-item">
              <input type="checkbox" name="category" value="business" checked>
              <span class="chip-content">
                <span class="chip-icon">💼</span>
                <span class="chip-name">비즈니스</span>
              </span>
            </label>
            <label class="chip-item">
              <input type="checkbox" name="category" value="sports" checked>
              <span class="chip-content">
                <span class="chip-icon">⚽</span>
                <span class="chip-name">스포츠</span>
              </span>
            </label>
            <label class="chip-item">
              <input type="checkbox" name="category" value="culture" checked>
              <span class="chip-content">
                <span class="chip-icon">🎭</span>
                <span class="chip-name">문화</span>
              </span>
            </label>
          </div>
        </div>

        <button type="button" id="btnFetchNews" class="btn-fetch-news">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>뉴스 보기</span>
        </button>
      </section>

      <!-- 관심 키워드 등록 및 관리 패널 -->
      <section class="keyword-panel" aria-label="관심 키워드 설정">
        <div class="keyword-input-group">
          <span class="keyword-label">관심 키워드 :</span>
          <form id="keywordForm" class="keyword-form">
            <input type="text" id="keywordInput" placeholder="+ 키워드 등록 (예: 손흥민, AI, 투자)" maxlength="20">
            <button type="submit" class="btn-add-keyword">등록</button>
          </form>
        </div>
        <div class="keyword-filter-mode">
          <label class="filter-mode-label" title="체크 시 등록한 키워드가 포함된 기사만 필터링하여 보여줍니다">
            <input type="checkbox" id="chkKeywordOnly" name="keywordOnly">
            <span class="toggle-slider"></span>
            <span class="mode-text">관심 기사만 보기</span>
          </label>
        </div>
        <div class="keyword-list" id="keywordList">
          <!-- 동적으로 등록된 키워드 태그가 표시됨 -->
        </div>
      </section>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="main-content">
    <div class="status-bar" id="statusBar">
      <div class="status-left">
        <span id="statusText">선택한 주제의 최신 헤드라인을 불러옵니다...</span>
        <span class="keyword-priority-hint" id="keywordPriorityHint" style="display:none;">
          🎯 관심 키워드 우선 정렬 적용됨
        </span>
      </div>
      <span class="article-count-badge" id="articleCountBadge">0건 로드됨</span>
    </div>

    <!-- 뉴스 피드 그리드 -->
    <div class="news-grid" id="newsGrid">
      <!-- 동적으로 카드 렌더링 -->
    </div>

    <!-- 빈 피드 안내 (스크랩 또는 검색 결과 없음) -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon" id="emptyIcon">📭</div>
      <h3 class="empty-title" id="emptyTitle">표시할 기사가 없습니다</h3>
      <p class="empty-desc" id="emptyDesc">다른 검색어를 입력하시거나 카테고리를 선택해 보세요.</p>
    </div>

    <!-- 로딩 스켈레톤 및 인디케이터 -->
    <div class="loading-indicator" id="loadingIndicator">
      <div class="spinner"></div>
      <p id="loadingText">기사를 불러오는 중입니다...</p>
    </div>

    <!-- 추가 로드를 위한 센티널(Sentinel) -->
    <div id="scrollSentinel" class="scroll-sentinel"></div>

    <!-- 더 이상 기사가 없을 때 안내 -->
    <div class="end-of-feed" id="endOfFeed" style="display: none;">
      모든 기사를 불러왔습니다 ✨
    </div>
  </main>

  <!-- 기사 본문 모달 창 -->
  <div class="modal-overlay" id="articleModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-top-actions">
        <!-- 모달 내 스크랩 토글 버튼 -->
        <button type="button" class="modal-bookmark-btn" id="modalBookmarkBtn" aria-label="기사 스크랩">
          <svg class="bookmark-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="bookmark-text" id="modalBookmarkText">스크랩</span>
        </button>

        <!-- 닫기 버튼 -->
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="창 닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-image-wrapper">
          <img id="modalImage" src="" alt="기사 대표 이미지" class="modal-image">
          <span class="modal-category-badge" id="modalCategoryBadge">비즈니스</span>
        </div>

        <div class="modal-content-container">
          <div class="modal-meta">
            <span class="modal-source" id="modalSource">출처</span>
            <span class="modal-dot">•</span>
            <span class="modal-date" id="modalDate">시간</span>
          </div>

          <h2 class="modal-title" id="modalTitle">기사 제목</h2>

          <div class="modal-text-content" id="modalTextContent">
            <!-- 기사 상세 내용 -->
          </div>

          <div class="modal-footer">
            <a id="modalOriginalLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-original-link">
              <span>원문 기사 전문 보기</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
